<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secure Document{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f5f7;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
    }

    h1 { font-size: 1.4rem; margin-bottom: 1.4rem; color: #0f172a; }

    label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; color: #374151; }

    input[type="email"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: .65rem .8rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 1.1rem;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,.15); }

    button[type="submit"],
    .btn {
      display: inline-block;
      width: 100%;
      padding: .7rem 1rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background .15s;
    }
    button[type="submit"]:hover, .btn:hover { background: #4338ca; }

    .btn-sm {
      width: auto;
      padding: .4rem .8rem;
      font-size: .82rem;
    }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-ghost {
      background: transparent;
      border: 1px solid #d1d5db;
      color: #374151;
    }
    .btn-ghost:hover { background: #f3f4f6; }

    .flash { padding: .7rem .9rem; border-radius: 6px; margin-bottom: 1rem; font-size: .9rem; }
    .flash-info  { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
    .flash-error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

    .muted { font-size: .82rem; color: #6b7280; margin-top: .7rem; }
    a { color: #4f46e5; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* Admin table */
    .wide { max-width: 900px; }
    table { width: 100%; border-collapse: collapse; font-size: .88rem; margin-top: .8rem; }
    th { text-align: left; font-weight: 600; color: #6b7280; padding: .5rem .7rem; border-bottom: 2px solid #e5e7eb; }
    td { padding: .55rem .7rem; border-bottom: 1px solid #f3f4f6; }
    tr:hover td { background: #f9fafb; }
    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 99px;
      font-size: .75rem;
      font-weight: 600;
    }
    .badge-pending  { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #d1fae5; color: #065f46; }
    .badge-used     { background: #e0e7ff; color: #3730a3; }
    section { margin-top: 2rem; }
    section h2 { font-size: 1rem; color: #374151; margin-bottom: .4rem; }
  </style>
</head>
<body>
  <div class="card {% block card_class %}{% endblock %}">
    {% with messages = get_flashed_messages() %}
      {% for msg in messages %}
        <div class="flash flash-info">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>
