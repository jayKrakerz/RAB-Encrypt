<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:0;background:#F9FAFB;font-family:system-ui,-apple-system,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F9FAFB;padding:32px 16px;">
  <tr><td align="center">
    <table width="520" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:12px;border:1px solid #E5E7EB;overflow:hidden;max-width:100%;">

      <tr>
        <td style="background:#450A0A;padding:28px 36px;">
          <p style="margin:0;color:#FECACA;font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;">SecureDocs Admin</p>
          <h1 style="margin:6px 0 0;color:#fff;font-size:22px;font-weight:700;">New Access Request</h1>
        </td>
      </tr>

      <tr>
        <td style="padding:32px 36px;">
          <p style="margin:0 0 20px;color:#374151;font-size:15px;line-height:1.6;">
            A new request to access <strong>{{ doc_name }}</strong> has been submitted.
          </p>

          <table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;margin-bottom:24px;">
            <tr style="background:#F9FAFB;">
              <td style="padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;width:120px;">From</td>
              <td style="padding:12px 16px;font-size:14px;color:#111827;font-weight:600;">{{ email }}</td>
            </tr>
            <tr style="border-top:1px solid #E5E7EB;">
              <td style="padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;">Document</td>
              <td style="padding:12px 16px;font-size:14px;color:#111827;">{{ doc_name }}</td>
            </tr>
            <tr style="border-top:1px solid #E5E7EB;">
              <td style="padding:12px 16px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#6B7280;">Received</td>
              <td style="padding:12px 16px;font-size:14px;color:#111827;">{{ now[:19] }} UTC</td>
            </tr>
          </table>

          <p style="margin:0;color:#374151;font-size:15px;line-height:1.6;">
            Log in to the admin panel to <strong>approve</strong> or <strong>deny</strong> this request.
          </p>
        </td>
      </tr>

      <tr>
        <td style="background:#F9FAFB;border-top:1px solid #E5E7EB;padding:20px 36px;">
          <p style="margin:0;font-size:12px;color:#9CA3AF;">SecureDocs automated notification. Do not reply to this email.</p>
        </td>
      </tr>

    </table>
  </td></tr>
</table>
</body>
</html>
